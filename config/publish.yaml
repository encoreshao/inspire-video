# Publishing limits used by scripts/publish_meta.py.
# UNVERIFIED defaults: platforms change their rules and I could not find an official source.
# Check the publish page of WeChat Channels (视频号助手) and Douyin (抖音创作者中心) and edit these numbers.
wechat_channels:
  short_title_min: 6      # 短标题
  short_title_max: 16
  description_max: 1000   # 描述
  hashtags_max: 5
douyin:
  title_max: 30           # conservative; older docs say 55
  description_max: 1000
  hashtags_max: 5
