[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inspire-video"
version = "0.1.0"
description = "Pipeline scaffold for bilingual inspirational short videos"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "pydantic>=2.7",
  "faster-whisper>=1.0",
  "jsonschema>=4.22",
  "yt-dlp[default]>=2025.11"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]
